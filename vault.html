  let html = `<button class="vt-cat-chip ${vtActiveCat==='all'?'active':''}" onclick="vtSetCat('all')"><i class="ti ti-layout-grid"></i>All</button>`;
  VT_CATS.forEach(c=>{
    const count = VT_ARTICLES.filter(a=>a.cat===c.id).length;
    if(!count) return;
    html += `<button class="vt-cat-chip ${vtActiveCat===c.id?'active':''}" onclick="vtSetCat('${c.id}')"><i class="ti ${c.icon}"></i>${c.label}</button>`;
  });
  wrap.innerHTML = html;

  const lenWrap = document.getElementById('vtLenCats');
  if(!lenWrap) return;
  let lenHtml = `<button class="vt-cat-chip vt-len-chip ${vtActiveLen==='all'?'active':''}" onclick="vtSetLen('all')"><i class="ti ti-list"></i>All lengths</button>`;
  VT_LEN_TIERS.forEach(t=>{
    const count = VT_ARTICLES.filter(a=>vtLenTier(a).id===t.id).length;
    if(!count) return;
    lenHtml += `<button class="vt-cat-chip vt-len-chip vt-len-chip-${t.id} ${vtActiveLen===t.id?'active':''}" onclick="vtSetLen('${t.id}')"><i class="ti ${t.icon}"></i>${t.label}</button>`;
  });
  lenWrap.innerHTML = lenHtml;
}

function vtSetCat(id){ vtActiveCat = id; vtRender(); }
function vtSetLen(id){ vtActiveLen = id; vtRender(); }

function vtSearchInput(v){
  vtQuery = v.trim().toLowerCase();
  document.getElementById('vtSearchClear').style.display = vtQuery ? 'flex' : 'none';
  vtRender();
}
function vtSearchClear(){
  vtQuery=''; document.getElementById('vtSearch').value=''; document.getElementById('vtSearchClear').style.display='none'; vtRender();
}
function vtToggleBookmarkFilter(){
  vtShowBookmarksOnly = !vtShowBookmarksOnly;
  document.getElementById('vtBmToggle').classList.toggle('active', vtShowBookmarksOnly);
  vtRender();
}

function vtMatches(a){
  if(vtActiveCat!=='all' && a.cat!==vtActiveCat) return false;
  if(vtActiveLen!=='all' && vtLenTier(a).id!==vtActiveLen) return false;
  if(vtShowBookmarksOnly && !vtIsBookmarked(a.id)) return false;
  if(vtQuery){
    const hay = (a.t+' '+a.d+' '+a.tags.join(' ')).toLowerCase();
    if(hay.indexOf(vtQuery)===-1) return false;
  }
  return true;
}

function vtRender(){
  vtRenderCats();
  const list = VT_ARTICLES.filter(vtMatches);
  const grid = document.getElementById('vtGrid');
  const empty = document.getElementById('vtEmpty');
  document.getElementById('vtResultCount').textContent = list.length + (list.length===1?' article':' articles');
  if(!list.length){
    grid.innerHTML=''; empty.style.display='block';
    return;
  }
  empty.style.display='none';
  grid.innerHTML = list.map(a=>{
    const cat = vtCat(a.cat);
    const len = vtLenTier(a);
    const bm = vtIsBookmarked(a.id);
    return `<div class="vt-card" onclick="vtOpenArticle('${a.id}')">
      <div class="vt-card-top"><span class="vt-card-icon"><i class="ti ${cat.icon}"></i></span><span class="vt-card-cat">${cat.label}</span><span class="vt-len-badge vt-len-badge-${len.id}"><i class="ti ${len.icon}"></i>${len.label}</span></div>
      <div class="vt-card-title">${a.t}</div>
      <div class="vt-card-deck">${a.d}</div>
      <div class="vt-card-bottom">
        <span class="vt-card-read"><i class="ti ti-clock" style="font-size:10px;margin-right:3px"></i>${a.r}</span>
        <button class="vt-card-bm ${bm?'on':''}" onclick="vtToggleBookmark('${a.id}', event)" title="Save"><i class="ti ${bm?'ti-bookmark-filled':'ti-bookmark'}"></i></button>
      </div>
    </div>`;
  }).join('');
}

/* ============ READ ALOUD (text-to-speech, female voice) ============ */
var __ttsVoices = [];
var __ttsActiveBtn = null;
function __ttsLoadVoices(){ __ttsVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
if('speechSynthesis' in window){ __ttsLoadVoices(); window.speechSynthesis.onvoiceschanged = __ttsLoadVoices; }
function __ttsFemaleVoice(){
  if(!__ttsVoices.length) __ttsLoadVoices();
  var pref = /female|zira|samantha|victoria|karen|moira|tessa|susan|fiona|kate|serena|allison|ava|salli|joanna|kimberly|amy|emma|ivy|jenny/i;
  return __ttsVoices.find(function(v){ return pref.test(v.name) && /^en/i.test(v.lang); })
      || __ttsVoices.find(function(v){ return pref.test(v.name); })
      || __ttsVoices.find(function(v){ return /^en/i.test(v.lang) && !/male/i.test(v.name); })
      || __ttsVoices[0] || null;
}
function __ttsResetBtn(btn){ if(!btn) return; btn.classList.remove('tts-playing'); btn.innerHTML = btn.dataset.ttsLabel || '<i class="ti ti-volume"></i>Listen'; }
function ttsStripHtml(html){ var d=document.createElement('div'); d.innerHTML = html==null?'':String(html); return (d.textContent||d.innerText||'').replace(/\s+/g,' ').trim(); }
function ttsToggle(text, btn){
  if(!('speechSynthesis' in window)){
    if(window.median && window.median.window && typeof window.median.window.open==='function'){
      if(confirm('Read-aloud isn\'t available inside the app. Open this page in your browser to listen?')){
        window.median.window.open(window.location.href, 'external');
      }
    } else {
      alert('Read-aloud is not supported in this browser.');
    }
    return;
  }
  var synth = window.speechSynthesis;
  if(synth.speaking){
    var wasSameBtn = (__ttsActiveBtn === btn);
    synth.cancel(); __ttsResetBtn(__ttsActiveBtn); __ttsActiveBtn = null;
    if(wasSameBtn) return;
  }
  var utter = new SpeechSynthesisUtterance(text);
  var voice = __ttsFemaleVoice();
  if(voice) utter.voice = voice;
  utter.rate = 0.98; utter.pitch = 1.05;
  utter.onend = function(){ __ttsResetBtn(btn); if(__ttsActiveBtn===btn) __ttsActiveBtn=null; };
  utter.onerror = function(){ __ttsResetBtn(btn); if(__ttsActiveBtn===btn) __ttsActiveBtn=null; };
  synth.speak(utter);
  if(btn){ if(!btn.dataset.ttsLabel) btn.dataset.ttsLabel = btn.innerHTML; btn.classList.add('tts-playing'); btn.innerHTML = '<i class="ti ti-player-stop"></i>Stop'; __ttsActiveBtn = btn; }
}
var vtCurrentArticleText = '';
function vtArticleText(a){
  var parts = [a.t, a.d];
  (a.body||[]).forEach(function(b){
    if(b.t==='p'||b.t==='h'||b.t==='quote') parts.push(ttsStripHtml(b.c));
    else if(b.t==='ul'||b.t==='ol') parts.push(b.c.map(ttsStripHtml).join('. '));
    else if(b.t==='fact') parts.push(b.c.map(function(f){return ttsStripHtml(f.k)+': '+ttsStripHtml(f.v);}).join('. '));
  });
  return parts.join('. ');
}
function vtReadArticle(btn){ ttsToggle(vtCurrentArticleText, btn); }

function vtBlockHtml(b){
  if(b.t==='p') return `<p class="vt-block-p">${b.c}</p>`;
  if(b.t==='h') return `<h3 class="vt-block-h">${b.c}</h3>`;
  if(b.t==='ul') return `<ul class="vt-block-ul">${b.c.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  if(b.t==='ol') return `<ol class="vt-block-ol">${b.c.map(i=>`<li>${i}</li>`).join('')}</ol>`;
  if(b.t==='quote') return `<div class="vt-quote">${b.c}</div>`;
  if(b.t==='fact') return `<div class="vt-facts">${b.c.map(f=>`<div class="vt-fact"><div class="vt-fact-k">${f.k}</div><div class="vt-fact-v">${f.v}</div></div>`).join('')}</div>`;
  if(b.t==='svg') return `<div class="vt-svg-wrap">${VT_SVGS[b.c]||''}</div>`;
  return '';
}

function vtRenderArticleBookmarkBtn(id){
  const el = document.getElementById('vtArtBmBtn');
  if(!el) return;
  const on = vtIsBookmarked(id);
  el.classList.toggle('on', on);
  el.innerHTML = `<i class="ti ${on?'ti-bookmark-filled':'ti-bookmark'}"></i>${on?'Saved':'Save'}`;
}

function vtOpenArticle(id){
  const a = VT_ARTICLES.find(x=>x.id===id);
  if(!a) return;
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  if(window.CanopusTrack) CanopusTrack.event('article', a.id, a.t);
  const cat = vtCat(a.cat);
  const len = vtLenTier(a);
  const rel = (a.rel||[]).map(rid=>VT_ARTICLES.find(x=>x.id===rid)).filter(Boolean);
  vtCurrentArticleText = vtArticleText(a);
  const body = document.getElementById('vtArticleBody');
  body.innerHTML = `
    <div class="vt-art-top">
      <span class="vt-art-cat"><i class="ti ${cat.icon}"></i>${cat.label}</span>
      <div class="vt-art-top-actions">
        <button class="vt-art-bm" id="vtListenBtn" onclick="vtReadArticle(this)"><i class="ti ti-volume"></i>Listen</button>
        <button class="vt-art-bm ${vtIsBookmarked(a.id)?'on':''}" id="vtArtBmBtn" onclick="vtToggleBookmark('${a.id}')"><i class="ti ${vtIsBookmarked(a.id)?'ti-bookmark-filled':'ti-bookmark'}"></i>${vtIsBookmarked(a.id)?'Saved':'Save'}</button>
      </div>
    </div>
    <h1 class="vt-art-title">${a.t}</h1>
    <p class="vt-art-deck">${a.d}</p>
    <div class="vt-art-read"><span class="vt-len-badge vt-len-badge-${len.id}" style="margin-right:8px"><i class="ti ${len.icon}"></i>${len.label}</span><i class="ti ti-clock" style="font-size:11px;margin-right:4px"></i>${a.r} read</div>
    ${a.body.map(vtBlockHtml).join('')}
    ${rel.length? `<div class="vt-related">
      <div class="vt-related-title">Related topics</div>
      <div class="vt-related-list">${rel.map(r=>`<div class="vt-related-pill" onclick="vtOpenArticle('${r.id}')"><i class="ti ${vtCat(r.cat).icon}"></i><span>${r.t}</span></div>`).join('')}</div>
    </div>`:''}
  `;
  document.getElementById('vtLibrary').style.display='none';
  document.getElementById('vtReader').style.display='block';
  document.querySelector('#page-vault .vt-wrap').scrollTop = 0;
  const pg = document.getElementById('page-vault');
  if(pg) pg.scrollTop = 0;
}

function vtCloseArticle(){
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  document.getElementById('vtReader').style.display='none';
  document.getElementById('vtLibrary').style.display='block';
}

function vtRandom(){
  const pool = VT_ARTICLES;
  const pick = pool[Math.floor(Math.random()*pool.length)];
  vtOpenArticle(pick.id);
}
document.addEventListener('DOMContentLoaded', function(){ vtRender(); });
</script>
<script>
/* ---- Canopus global terminal shortcut: redirects into index.html's Terminal page ---- */
(function(){
  var SC_KEY='canopus_term_shortcut';
  function getShortcut(){
    try{var raw=localStorage.getItem(SC_KEY);if(raw)return JSON.parse(raw);}catch(e){}
    return {alt:true,ctrl:false,shift:false,meta:false,key:'`'};
  }
  function matches(e,sc){
    if(!sc||!sc.key)return false;
    return !!sc.ctrl===e.ctrlKey&&!!sc.alt===e.altKey&&!!sc.shift===e.shiftKey&&!!sc.meta===e.metaKey&&(e.key||'').toLowerCase()===sc.key.toLowerCase();
  }
  document.addEventListener('keydown',function(e){
    var el=document.activeElement;
    var typing=el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.isContentEditable);
    if(typing)return;
    if(matches(e,getShortcut())){
      e.preventDefault();
      window.location.href='index.html?openTerminal=1';
    }
  },true);
})();
</script>
<script>
/* ---- Canopus: local keyboard shortcut to hide/show this page's header (persists across all Canopus pages) ---- */
(function(){
  var nav=document.getElementById('app-nav')||document.querySelector('header');
  if(!nav)return;
  function setHidden(hidden){
    document.documentElement.classList.toggle('chdr-hidden',hidden);
    try{localStorage.setItem('canopusHeaderHidden',hidden?'1':'0');}catch(e){}
  }
  document.addEventListener('keydown',function(e){
    var el=document.activeElement;
    var typing=el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.isContentEditable);
    if(typing)return;
    if(e.altKey&&e.shiftKey&&!e.ctrlKey&&!e.metaKey&&(e.key||'').toLowerCase()==='h'){
      e.preventDefault();
      setHidden(!document.documentElement.classList.contains('chdr-hidden'));
    }
  },true);
})();
</script>
