<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{if(localStorage.getItem('canopusHeaderHidden')==='1')document.documentElement.classList.add('chdr-hidden');}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canopus — Knowledge Vault</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root,body[data-accent="white"]{
  --accent:#fff;--accent-hover:#ddd;--accent-on:#000;--accent-muted:#2a2a2a;--accent-soft:rgba(255,255,255,.06);
}
body[data-accent="blue"]{
  --accent:#5a9fd4;--accent-hover:#4a8fc4;--accent-on:#000;--accent-muted:#2a4a6a;--accent-soft:rgba(90,159,212,.12);
}
body[data-accent="green"]{
  --accent:#4a9a6a;--accent-hover:#3a8a5a;--accent-on:#000;--accent-muted:#1a3a2a;--accent-soft:rgba(74,154,106,.12);
}
body[data-accent="amber"]{
  --accent:#c9952a;--accent-hover:#b8851a;--accent-on:#000;--accent-muted:#4a3a1a;--accent-soft:rgba(201,149,42,.12);
}
body[data-accent="pink"]{
  --accent:#e0629c;--accent-hover:#cf4f8a;--accent-on:#000;--accent-muted:#4a1a32;--accent-soft:rgba(224,98,156,.12);
}
body.light[data-accent="white"]{
  --accent:#111;--accent-hover:#333;--accent-on:#fff;--accent-muted:#aaa;--accent-soft:rgba(0,0,0,.05);
}
:root{
  --surf-bg:#000;--surf-panel:#0a0a0a;--surf-panel-hi:#111;--surf-modal:#0d0e10;--surf-line:var(--surf-line);
}
body.grey{
  --surf-bg:#0A0A0B;--surf-panel:#111214;--surf-panel-hi:#17181B;--surf-modal:#111214;--surf-line:#212327;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--surf-bg);color:#fff;font-family:'Inter',sans-serif;height:100%}
.page{position:relative;display:flex}

/* ── NAV (shared with index.html) ── */
html.chdr-hidden #app-nav{display:none!important}
#app-nav{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;z-index:100;background:linear-gradient(var(--surf-bg) 70%,transparent);pointer-events:none}
#app-nav>*{pointer-events:auto}
.nav-logo{font-size:11px;font-weight:500;letter-spacing:.18em;color:rgba(255,255,255,.7);text-transform:uppercase}
.nav-logo-wrap{display:flex;align-items:center;gap:6px}
.nav-logo-info{width:18px;height:18px;border-radius:50%;border:0.5px solid rgba(255,255,255,.45);background:none;color:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;transition:all .2s;flex-shrink:0}
.nav-logo-info:hover{color:#fff;border-color:#fff}
.nav-links{display:flex;gap:2px;padding:2px}
.nav-link{padding:6px 14px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;color:#333;transition:color .2s,background .2s;border:none;background:none;letter-spacing:.06em;font-family:'Inter',sans-serif}
.nav-link.active{color:var(--accent);background:var(--accent-soft)}
.nav-link:hover:not(.active){color:#666}
.nav-util{display:flex;align-items:center;gap:4px}
.nav-fs{width:30px;height:30px;border-radius:7px;background:transparent;border:none;color:#333;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:color .2s}
.nav-fs:hover{color:#888}
.nav-menu-pop{position:fixed;right:24px;top:52px;background:var(--surf-panel);border:0.5px solid var(--surf-line);border-radius:10px;padding:4px;min-width:168px;z-index:110;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.nav-menu-pop.open{display:block}
.nav-menu-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;font-size:11px;color:#555;background:none;border:none;width:100%;text-align:left;cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:.04em;transition:background .12s,color .12s}
.nav-menu-item:hover{background:var(--surf-panel-hi);color:#aaa}
.nav-menu-item i{font-size:13px;width:14px;color:#333}
.nav-accent-pop{position:fixed;right:62px;top:52px;background:var(--surf-panel);border:0.5px solid var(--surf-line);border-radius:10px;padding:8px 10px;z-index:110;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5);align-items:center;gap:7px}
.nav-accent-pop.open{display:flex}
.accent-swatch{width:22px;height:22px;border-radius:50%;border:0.5px solid #333;background:var(--swatch);cursor:pointer;transition:transform .12s,box-shadow .12s;padding:0;flex-shrink:0}
.accent-swatch:hover{transform:scale(1.08)}
.accent-swatch.active{box-shadow:0 0 0 2px #000,0 0 0 3.5px var(--swatch)}
.accent-swatch[data-accent="white"]{--swatch:#fff}
.accent-swatch[data-accent="blue"]{--swatch:#5a9fd4}
.accent-swatch[data-accent="green"]{--swatch:#4a9a6a}
.accent-swatch[data-accent="amber"]{--swatch:#c9952a}
.accent-swatch[data-accent="pink"]{--swatch:#e0629c}
.nav-pop-sep{width:0.5px;align-self:stretch;background:#222;margin:0 1px}
body.light .nav-pop-sep{background:#e2e0d9}
.surface-swatch{width:22px;height:22px;border-radius:50%;border:0.5px solid #333;background:var(--sw);cursor:pointer;transition:transform .12s,box-shadow .12s;padding:0;flex-shrink:0}
.surface-swatch:hover{transform:scale(1.08)}
.surface-swatch.active{box-shadow:0 0 0 2px #000,0 0 0 3.5px var(--sw)}
body.light .surface-swatch.active{box-shadow:0 0 0 2px #f5f5f0,0 0 0 3.5px var(--sw)}
.surface-swatch[data-surface="black"]{--sw:#000;border-color:#444}
.surface-swatch[data-surface="grey"]{--sw:#3a3b3e}
.surface-swatch[data-surface="white"]{--sw:#fff}
body.light #app-nav{background:linear-gradient(#f5f5f0 70%,transparent)}
body.light .nav-logo{color:rgba(0,0,0,.55)}
body.light .nav-logo-info{border-color:rgba(0,0,0,.35);color:rgba(0,0,0,.55)}
body.light .nav-logo-info:hover{color:#000;border-color:#000}
body.light .nav-link{color:#aaa}
body.light .nav-link.active{color:var(--accent);background:var(--accent-soft)}
body.light .nav-fs{color:#aaa}
body.light .nav-menu-pop{background:#fff;border-color:#ddd;box-shadow:0 8px 24px rgba(0,0,0,.08)}
body.light .nav-accent-pop{background:#fff;border-color:#ddd;box-shadow:0 8px 24px rgba(0,0,0,.08)}
body.light .nav-menu-item{color:#777}
body.light .nav-menu-item:hover{background:#f0f0eb;color:#333}
body.light .nav-menu-item i{color:#bbb}
body.light .accent-swatch.active{box-shadow:0 0 0 2px #f5f5f0,0 0 0 3.5px var(--swatch)}
@media(max-width:640px){
  .nav-logo-wrap{display:none}
  #app-nav{padding:16px 16px;background:linear-gradient(var(--surf-bg) 85%,transparent)}
  body.light #app-nav{background:linear-gradient(#f5f5f0 85%,transparent)}
  .nav-links{max-width:calc(100vw - 148px);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:4px}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-link{padding:9px 16px;font-size:14px;white-space:nowrap;flex-shrink:0}
  .nav-fs{width:36px;height:36px;font-size:16px}
  .nav-util{gap:6px}
  .nav-menu-pop,.nav-accent-pop{top:64px}
}
@media(max-width:400px){
  .nav-links{max-width:calc(100vw - 128px);gap:2px}
  .nav-link{padding:8px 13px;font-size:13px}
  .nav-fs{width:34px;height:34px;font-size:15px}
}
/* ══ KNOWLEDGE VAULT ══ */
#page-vault{
  --vt-bg:#0A0A0B;--vt-panel:#111214;--vt-panel-hi:#17181B;--vt-line:#212327;
  --vt-text-hi:#EDEDEE;--vt-text-lo:#8B8E94;--vt-text-faint:#4C4F55;--vt-radius:14px;
  flex-direction:column;background:var(--vt-bg);color:var(--vt-text-hi);overflow-y:auto;overflow-x:hidden;
  font-family:'Work Sans',sans-serif;font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased;
}
#page-vault ::selection{background:var(--accent-muted);color:var(--vt-text-hi)}
.vt-wrap{max-width:840px;margin:0 auto;padding:72px 24px 120px;width:100%}
.vt-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px}
.vt-brand-row{display:flex;align-items:center;gap:10px}
.vt-brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.vt-title{font-family:'Fraunces',serif;font-weight:500;font-size:23px;letter-spacing:-.01em;color:var(--vt-text-hi);margin:0}
.vt-sub{font-size:12px;color:var(--vt-text-faint);letter-spacing:.02em;margin-left:40px;display:block;margin-top:1px}
.vt-random{display:flex;align-items:center;gap:7px;padding:9px 15px 9px 13px;border-radius:9px;background:var(--vt-panel);border:0.5px solid var(--vt-line);color:var(--vt-text-lo);font-size:12.5px;font-weight:500;letter-spacing:.01em;cursor:pointer;font-family:'Work Sans',sans-serif;transition:all .15s;flex-shrink:0}
.vt-random:hover{border-color:var(--accent);color:var(--vt-text-hi)}
.vt-random i{font-size:14px}
.vt-search-wrap{position:relative;margin-bottom:16px}
.vt-search-ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--vt-text-faint);font-size:15px;pointer-events:none}
.vt-search-wrap input{width:100%;background:var(--vt-panel);border:0.5px solid var(--vt-line);border-radius:11px;padding:12px 40px;font-size:13.5px;color:var(--vt-text-hi);font-family:'Work Sans',sans-serif;transition:border-color .15s}
.vt-search-wrap input::placeholder{color:var(--vt-text-faint)}
.vt-search-wrap input:focus{outline:none;border-color:var(--accent-muted)}
.vt-search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:7px;background:none;border:none;color:var(--vt-text-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px}
.vt-search-clear:hover{color:var(--vt-text-hi)}
.vt-cats{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.vt-cats::-webkit-scrollbar{display:none}
.vt-cat-chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;border:0.5px solid var(--vt-line);background:var(--vt-panel);color:var(--vt-text-lo);font-size:11.5px;font-weight:500;letter-spacing:.02em;cursor:pointer;transition:all .15s;font-family:'Work Sans',sans-serif;white-space:nowrap}
.vt-cat-chip i{font-size:13px}
.vt-cat-chip:hover{color:var(--vt-text-hi);border-color:#333}
.vt-cat-chip.active{background:var(--accent-soft);border-color:var(--accent-muted);color:var(--accent)}
.vt-meta-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 2px}
.vt-result-count{font-size:11px;color:var(--vt-text-faint);letter-spacing:.04em;font-family:'IBM Plex Mono',monospace}
.vt-bm-toggle{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--vt-text-faint);cursor:pointer;letter-spacing:.02em;transition:color .15s;padding:4px 8px;border-radius:7px}
.vt-bm-toggle:hover{color:var(--vt-text-lo)}
.vt-bm-toggle.active{color:var(--accent)}
.vt-bm-toggle i{font-size:13px}
.vt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.vt-card{background:var(--vt-panel);border:0.5px solid var(--vt-line);border-radius:var(--vt-radius);padding:16px 16px 14px;cursor:pointer;transition:border-color .15s,transform .15s;position:relative;display:flex;flex-direction:column}
.vt-card:hover{border-color:#333;transform:translateY(-1px)}
.vt-card-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.vt-card-icon{width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.vt-card-cat{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--vt-text-faint);font-weight:600}
.vt-card-title{font-family:'Fraunces',serif;font-weight:500;font-size:15.5px;color:var(--vt-text-hi);line-height:1.32;margin-bottom:6px}
.vt-card-deck{font-size:12px;color:var(--vt-text-lo);line-height:1.5;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px}
.vt-card-bottom{display:flex;align-items:center;justify-content:space-between}
.vt-card-read{font-size:10.5px;color:var(--vt-text-faint);font-family:'IBM Plex Mono',monospace;letter-spacing:.02em}
.vt-card-bm{width:24px;height:24px;border-radius:7px;background:none;border:none;color:var(--vt-text-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:color .15s}
.vt-card-bm:hover{color:var(--vt-text-hi)}
.vt-card-bm.on{color:var(--accent)}

.vt-cats-len{margin-top:2px}
.vt-len-chip{padding:5px 11px;font-size:10.5px}
.vt-len-chip-short.active{background:rgba(122,178,122,.14);border-color:rgba(122,178,122,.4);color:#8FCB8F}
.vt-len-chip-medium.active{background:rgba(210,178,110,.14);border-color:rgba(210,178,110,.4);color:#E0BE84}
.vt-len-chip-long.active{background:rgba(163,140,220,.14);border-color:rgba(163,140,220,.4);color:#BCA6EE}
.vt-len-badge{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap}
.vt-len-badge i{font-size:11px}
.vt-len-badge-short{background:rgba(122,178,122,.12);color:#8FCB8F}
.vt-len-badge-medium{background:rgba(210,178,110,.12);color:#E0BE84}
.vt-len-badge-long{background:rgba(163,140,220,.12);color:#BCA6EE}
.vt-card-top .vt-len-badge{margin-left:auto}
.vt-empty{text-align:center;padding:80px 20px 40px;color:var(--vt-text-faint)}
.vt-empty i{font-size:24px;color:var(--vt-text-faint);margin-bottom:14px;display:block}
.vt-empty h2{font-family:'Fraunces',serif;font-weight:400;font-size:18px;color:var(--vt-text-lo);margin-bottom:6px}
.vt-empty p{font-size:12.5px;max-width:300px;margin:0 auto;line-height:1.55}
.vt-back{display:flex;align-items:center;gap:7px;background:none;border:none;color:var(--vt-text-faint);font-size:12px;letter-spacing:.03em;cursor:pointer;padding:8px 4px;margin-bottom:18px;font-family:'Work Sans',sans-serif;transition:color .15s}
.vt-back:hover{color:var(--vt-text-hi)}
.vt-back i{font-size:14px}
.vt-article{padding-bottom:20px}
.vt-art-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
.vt-art-cat{display:flex;align-items:center;gap:7px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:600}
.vt-art-cat i{font-size:14px}
.vt-art-bm{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:9px;border:0.5px solid var(--vt-line);background:var(--vt-panel);color:var(--vt-text-lo);font-size:11.5px;cursor:pointer;transition:all .15s;font-family:'Work Sans',sans-serif;flex-shrink:0}
.vt-art-bm:hover{color:var(--vt-text-hi)}
.vt-art-bm.on{color:var(--accent);border-color:var(--accent-muted);background:var(--accent-soft)}
.vt-art-top-actions{display:flex;align-items:center;gap:8px}
.tts-playing{color:var(--accent)!important;border-color:var(--accent-muted)!important;background:var(--accent-soft)!important}
.vt-art-title{font-family:'Fraunces',serif;font-weight:500;font-size:29px;letter-spacing:-.01em;line-height:1.2;color:var(--vt-text-hi);margin-bottom:10px}
.vt-art-deck{font-size:15px;color:var(--vt-text-lo);line-height:1.55;margin-bottom:10px}
.vt-art-read{font-size:11px;color:var(--vt-text-faint);font-family:'IBM Plex Mono',monospace;letter-spacing:.03em;margin-bottom:26px;padding-bottom:22px;border-bottom:0.5px solid var(--vt-line)}
.vt-block-h{font-family:'Fraunces',serif;font-weight:500;font-size:17.5px;color:var(--vt-text-hi);margin:26px 0 10px}
.vt-block-p{font-size:14.5px;color:#C7C8CB;line-height:1.75;margin-bottom:14px}
.vt-block-ul,.vt-block-ol{margin:0 0 14px;padding-left:20px}
.vt-block-ul li,.vt-block-ol li{font-size:14px;color:#C7C8CB;line-height:1.7;margin-bottom:5px}
.vt-quote{border-left:2px solid var(--accent-muted);padding:2px 0 2px 16px;margin:20px 0;font-family:'Fraunces',serif;font-style:italic;font-size:16.5px;color:var(--vt-text-hi);line-height:1.55}
.vt-facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1px;background:var(--vt-line);border:0.5px solid var(--vt-line);border-radius:11px;overflow:hidden;margin:18px 0}
.vt-fact{background:var(--vt-panel-hi);padding:12px 14px}
.vt-fact-k{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--vt-text-faint);margin-bottom:4px}
.vt-fact-v{font-size:13px;color:var(--vt-text-hi);font-weight:500;line-height:1.4}
.vt-svg-wrap{background:var(--vt-panel-hi);border:0.5px solid var(--vt-line);border-radius:12px;padding:18px 14px 14px;margin:20px 0;color:var(--accent)}
.vt-svg-wrap svg{width:100%;height:auto;display:block}
.vt-related{margin-top:32px;padding-top:22px;border-top:0.5px solid var(--vt-line)}
.vt-related-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--vt-text-faint);margin-bottom:12px;font-weight:600}
.vt-related-list{display:flex;flex-wrap:wrap;gap:8px}
.vt-related-pill{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;border:0.5px solid var(--vt-line);background:var(--vt-panel);cursor:pointer;transition:all .15s;max-width:100%}
.vt-related-pill:hover{border-color:var(--accent-muted)}
.vt-related-pill i{color:var(--accent);font-size:12px;flex-shrink:0}
.vt-related-pill span{font-size:12.5px;color:var(--vt-text-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.light #page-vault{
  --vt-bg:#F7F6F3;--vt-panel:#FFFFFF;--vt-panel-hi:#F0EFEA;--vt-line:#E2E0D9;
  --vt-text-hi:#161512;--vt-text-lo:#5C594F;--vt-text-faint:#9A968A;
}
body.light #page-vault .vt-block-p,body.light #page-vault .vt-block-ul li,body.light #page-vault .vt-block-ol li{color:#3A382F}
@media(max-width:640px){
  .vt-wrap{padding:72px 16px 100px}
  .vt-sub{margin-left:0;display:block}
  .vt-header{flex-direction:column;align-items:flex-start}
  .vt-header-btns{width:100%}
  .vt-explore-btn,.vt-random{flex:1;justify-content:center}
  .vt-grid{grid-template-columns:1fr}
  .vt-art-title{font-size:24px}
}


/* ── naming-info modal (reused from main app) ── */
.nm-info-btn{width:20px;height:20px;border-radius:50%;border:0.5px solid currentColor;opacity:.6;background:none;color:inherit;display:inline-flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;margin-left:8px;flex-shrink:0;transition:opacity .2s}
.nm-info-btn:hover{opacity:1}
.nm-heading{display:inline-flex;align-items:center;gap:2px;flex-wrap:wrap}
.nm-celestial{font-weight:700;text-transform:uppercase}
.nm-paren{font-weight:400;text-transform:none;opacity:.55;font-size:.72em;letter-spacing:.02em;margin-left:5px}
.nm-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:950;opacity:0;pointer-events:none;transition:opacity .2s;padding:20px}

<script>
/* ── Nav header: keep the open feature's tab centered in the scrollable
   mobile strip, but leave it wherever the user scrolls it once they've
   touched/dragged the strip themselves. ── */
(function(){
  function setup(){
    var navLinks=document.querySelector('#app-nav .nav-links');
    if(!navLinks) return;
    var userTouching=false;
    var releaseTimer=null;
    function touchStart(){ userTouching=true; clearTimeout(releaseTimer); }
    function touchEnd(){ clearTimeout(releaseTimer); releaseTimer=setTimeout(function(){ userTouching=false; },150); }
    navLinks.addEventListener('touchstart',touchStart,{passive:true});
    navLinks.addEventListener('touchend',touchEnd,{passive:true});
    navLinks.addEventListener('touchcancel',touchEnd,{passive:true});
    navLinks.addEventListener('mousedown',touchStart);
    window.addEventListener('mouseup',touchEnd);
    window.centerActiveNav=function(smooth){
      if(userTouching) return;
      var active=navLinks.querySelector('.nav-link.active');
      if(!active) return;
      active.scrollIntoView({behavior:smooth?'smooth':'auto',inline:'center',block:'nearest'});
    };
    window.centerActiveNav(false);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',setup);
  else setup();
})();
</script>

/* ---- theme & accent (shared prefs with index.html via localStorage) ---- */
const THEME_KEY='dayplan_theme';
const ACCENT_KEY='dayplan_accent';
const SURFACE_KEY='dayplan_surface';
const APP_ACCENTS=['white','blue','green','amber','pink'];
const APP_SURFACES=['black','grey'];
let appTheme='dark';
let appAccent='white';
let appSurface='black';

function saveAppPreferences(){
  try{
    localStorage.setItem(THEME_KEY,appTheme);
    localStorage.setItem(ACCENT_KEY,appAccent);
    localStorage.setItem(SURFACE_KEY,appSurface);
  }catch(e){}
}
function updateAccentSwatches(){
  document.querySelectorAll('.accent-swatch').forEach(s=>{
    s.classList.toggle('active',s.dataset.accent===appAccent);
  });
  document.querySelectorAll('.surface-swatch').forEach(s=>{
    const isActive=(appTheme==='light'&&s.dataset.surface==='white')||(appTheme==='dark'&&s.dataset.surface===appSurface);
    s.classList.toggle('active',isActive);
  });
}
function applyAppPreferences(){
  document.body.classList.toggle('light',appTheme==='light');
  document.body.classList.toggle('grey',appTheme==='dark'&&appSurface==='grey');
  document.body.dataset.accent=appAccent;
  const icon=appTheme==='dark'?'<i class="ti ti-sun"></i>':'<i class="ti ti-moon"></i>';
  document.querySelectorAll('[onclick="toggleAppTheme()"]').forEach(b=>b.innerHTML=icon);
  updateAccentSwatches();
}
function loadAppPreferences(){
  try{
    const t=localStorage.getItem(THEME_KEY);
    const a=localStorage.getItem(ACCENT_KEY);
    const s=localStorage.getItem(SURFACE_KEY);
    if(t==='light'||t==='dark') appTheme=t;
    if(a&&APP_ACCENTS.includes(a)) appAccent=a;
    if(s&&APP_SURFACES.includes(s)) appSurface=s;
  }catch(e){}
  applyAppPreferences();
}
function toggleAppTheme(){
  appTheme=appTheme==='dark'?'light':'dark';
  applyAppPreferences();
  saveAppPreferences();
}
function setAppSurface(surface){
  if(surface==='white'){
    appTheme='light';
  }else if(APP_SURFACES.includes(surface)){
    appTheme='dark';
    appSurface=surface;
  }else{
    return;
  }
  applyAppPreferences();
  saveAppPreferences();
  closeAccentPicker();
}
function setAppAccent(accent){
  if(!APP_ACCENTS.includes(accent)) return;
  appAccent=accent;

const VT_ARTICLES = [
{id:'surv-priorities',cat:'survival',t:`The Rule of Threes`,d:`The simple survival hierarchy that tells you exactly what to worry about first when everything has gone wrong.`,r:`3 min`,tags:[`survival`,`priorities`,`outdoors`],body:[
 {t:'p',c:`Survival experts teach a rough rule of thumb for what kills people fastest: you can survive roughly 3 minutes without air, 3 hours without shelter in a harsh environment, 3 days without water, and 3 weeks without food. It's not exact, but it's a fast triage tool for a bad situation.`},
 {t:'h',c:`Why order matters more than instinct`},
 {t:'p',c:`Most untrained people in a survival situation panic about food first, because hunger feels urgent. In reality, exposure — cold, wet, wind — is the far more common killer, especially in temperate wilderness. A person can die of hypothermia in a single cold, wet night.`},
 {t:'fact',c:[{k:`Air`,v:`~3 minutes`},{k:`Shelter`,v:`~3 hours (extreme)`},{k:`Water`,v:`~3 days`},{k:`Food`,v:`~3 weeks`}]},
 {t:'h',c:`Applying it`},
 {t:'ul',c:[`Fix breathing or bleeding emergencies immediately — they're the only true minutes-count problems.`,`Get out of wind and wet before anything else; a simple lean-to or space blanket beats a fire in urgency.`,`Find or purify water within the first day if you're not carrying enough.`,`Only start worrying seriously about food after the first two or three days.`]},
 {t:'quote',c:`The wilderness doesn't kill people for lack of food — it kills them for lack of shelter and a clear head.`},
],rel:['surv-water','fa-bleeding','fa-stroke']},

{id:'surv-water',cat:'survival',t:`Finding and Purifying Water in the Wild`,d:`Where to look for drinkable water when you're stranded, and the three practical ways to make it safe to drink.`,r:`4 min`,tags:[`survival`,`water`,`purification`],body:[
 {t:'p',c:`Dehydration impairs judgment long before it becomes fatal, which is exactly when you need clear thinking most. Finding a water source is usually easier than people expect — moving water, morning dew, and even plant transpiration can all be exploited.`},
 {t:'h',c:`Where to look`},
 {t:'ul',c:[`Follow terrain downhill — water pools in valleys and low points.`,`Green, lush vegetation growing in an otherwise dry area often marks a hidden spring.`,`Bird flight patterns at dawn and dusk often lead to water.`,`Collecting morning dew with cloth wrung into a container can yield surprising amounts.`]},
 {t:'h',c:`Making it safe`},
 {t:'p',c:`Clear-looking water can still carry parasites like Giardia and bacteria that cause severe diarrhea — a serious problem when you can't afford to lose fluids. There are three reliable methods, ranked by effectiveness.`},
 {t:'ol',c:[`Boiling — a rolling boil for one minute (three at high altitude) kills essentially everything.`,`Filtration — a purpose-built filter (or improvised sand/charcoal/cloth layers as a last resort) removes larger pathogens and sediment.`,`Chemical treatment — iodine or chlorine tablets work but need contact time and don't remove sediment.`]},
 {t:'p',c:`Boiling plus a simple filter for sediment is the gold-standard field combination. Avoid drinking untreated water even when desperate — a treatable stomach bug becomes far more dangerous once you're already weakened.`},
],rel:['surv-priorities','sci-water','fa-bleeding']},

{id:'fa-bleeding',cat:'firstaid',t:`Stopping Severe Bleeding`,d:`Uncontrolled bleeding can kill in minutes — here is the exact sequence trauma responders use, including when and how to use a tourniquet.`,r:`4 min`,tags:[`first aid`,`trauma`,`tourniquet`],body:[
 {t:'p',c:`Severe external bleeding is one of the few true medical emergencies where minutes matter more than almost anything else you'll encounter. A person can bleed to death from a major limb wound in as little as five minutes. The response is simple and can be learned in a few minutes.`},
 {t:'h',c:`The sequence`},
 {t:'ol',c:[`Call for emergency help immediately, or have someone else do it while you act.`,`Apply firm, direct pressure to the wound with whatever clean material is available — a cloth, shirt, or gauze.`,`If bleeding continues to soak through, add more material on top rather than removing the first layer.`,`For a severe limb wound that won't stop with pressure, apply a tourniquet 2–3 inches above the wound, tighten until bleeding stops, and note the time applied.`]},
 {t:'quote',c:`A tourniquet applied too loosely is worse than none at all — it should hurt, and the bleeding should visibly stop.`},
 {t:'h',c:`What modern guidance changed`},
 {t:'p',c:`For decades, tourniquets were taught as a last resort due to fears about limb loss. Military and trauma data from the 2000s onward reversed that thinking: a tourniquet left on for a few hours rarely causes lasting harm, while blood loss from hesitation often does. Get one on early rather than trying pressure alone for too long.`},
 {t:'fact',c:[{k:`Time to danger`,v:`As little as 5 min`},{k:`Tourniquet placement`,v:`2–3 in above wound`},{k:`Safe duration`,v:`Up to ~2 hrs typically`}]},
],rel:['fa-stroke','surv-priorities','ppl-curie']},

{id:'fa-stroke',cat:'firstaid',t:`Recognizing a Stroke — the FAST Test`,d:`A four-part test anyone can run in ten seconds that can mean the difference between recovery and permanent damage.`,r:`3 min`,tags:[`first aid`,`stroke`,`emergency`],body:[
 {t:'p',c:`A stroke happens when blood flow to part of the brain is cut off, and brain cells begin dying within minutes. Fast recognition genuinely changes outcomes, because clot-dissolving treatment only works within a narrow window after symptoms start — typically a few hours.`},
 {t:'h',c:`F.A.S.T.`},
 {t:'ul',c:[`Face — ask the person to smile. Does one side droop?`,`Arms — ask them to raise both arms. Does one drift downward?`,`Speech — ask them to repeat a simple sentence. Is it slurred or strange?`,`Time — if any of these are abnormal, call emergency services immediately and note the time symptoms started.`]},
 {t:'p',c:`That last point matters more than people realize: doctors need to know exactly when symptoms began, because it determines which treatments are still safe and effective. Don't wait to see if symptoms improve — treat any "yes" on the FAST test as a genuine emergency.`},
 {t:'quote',c:`Time lost is brain lost — it's the single most repeated phrase in stroke medicine.`},
],rel:['fa-bleeding','psy-bias']},

{id:'sci-water',cat:'science',t:`The Water Cycle`,d:`How the same water has been endlessly recycled through oceans, clouds, and rivers for roughly four billion years.`,r:`3 min`,tags:[`science`,`earth`,`weather`],body:[
 {t:'p',c:`Nearly all the water on Earth today is the same water that has existed since the planet's oceans formed billions of years ago. It simply moves in a continuous loop, powered by the sun and gravity, between the ocean, atmosphere, and land.`},
 {t:'svg',c:'watercycle'},
 {t:'h',c:`The four main stages`},
 {t:'ul',c:[`Evaporation — solar heat turns surface water into vapor, mostly from the oceans.`,`Condensation — rising vapor cools at altitude and forms clouds.`,`Precipitation — water falls back down as rain, snow, or hail.`,`Collection — water gathers in rivers, lakes, and groundwater, eventually returning to the sea.`]},
 {t:'p',c:`Plants add a fifth process called transpiration, releasing water vapor through their leaves — a single large tree can release hundreds of liters of water into the air on a hot day, meaningfully affecting local humidity.`},
],rel:['surv-water','geo-tectonics','sci-vaccines']},

{id:'sci-vaccines',cat:'science',t:`How Vaccines Work`,d:`Vaccines don't fight disease directly — they train your immune system to recognize a threat before it ever shows up.`,r:`4 min`,tags:[`science`,`biology`,`immunology`],body:[
 {t:'p',c:`Your immune system fights infections partly through specialized cells that "remember" pathogens they've encountered before, reacting far faster the second time. A vaccine exploits this by giving your immune system a safe preview of a pathogen — a weakened form, a killed version, a single protein, or genetic instructions to build one — without causing the actual disease.`},
 {t:'h',c:`Why this matters practically`},
 {t:'p',c:`Without a vaccine, your first encounter with a dangerous pathogen is the real infection, and your immune system needs days to build a full response — often too slow to prevent serious illness. With a vaccine, that "first encounter" already happened safely, so your body can respond within hours instead of days.`},
 {t:'h',c:`Herd immunity`},
 {t:'p',c:`When enough of a population is immune, a pathogen struggles to find new hosts to infect, and outbreaks fizzle out even among people who aren't vaccinated — including those who medically can't be, like newborns or the immunocompromised. The exact threshold needed varies by how contagious a disease is.`},
 {t:'fact',c:[{k:`Measles herd immunity`,v:`~95% needed`},{k:`Response time, unprimed`,v:`~1–2 weeks`},{k:`Response time, vaccinated`,v:`Hours to days`}]},
],rel:['sci-water','ppl-curie','inv-penicillin']},

{id:'eng-bridges',cat:'engineering',t:`How Suspension Bridges Hold Their Weight`,d:`The elegant physics that lets a mile of roadway hang from little more than steel cable and two towers.`,r:`4 min`,tags:[`engineering`,`bridges`,`structures`],body:[
 {t:'p',c:`A suspension bridge looks like it shouldn't work — a road hanging from thin cables strung between towers — but the design is one of the most efficient ways ever devised to span a long distance, because it converts almost all the load into simple tension.`},
 {t:'h',c:`The core idea`},
 {t:'p',c:`Two tall towers anchor a pair of thick main cables that drape between them. Thinner vertical cables, called suspenders, hang down from the main cables and hold up the road deck. The weight of the deck and traffic pulls down on the suspenders, which pulls down on the main cables, which pulls outward on the towers and down into massive anchorages buried in the ground at each end.`},
 {t:'ul',c:[`Towers experience mostly compression — they're pushed straight down, which steel and concrete resist extremely well.`,`Main cables experience pure tension — steel wire is exceptionally strong when simply being pulled.`,`Anchorages resist the enormous outward pull of the cables using sheer buried mass.`]},
 {t:'p',c:`Because steel cable is so strong in tension relative to its weight, this design lets engineers span far greater distances than a rigid beam bridge ever could — the Akashi Kaikyō Bridge in Japan spans just under two kilometers between towers.`},
],rel:['eng-skyscrapers','ship-buoyancy']},

{id:'eng-skyscrapers',cat:'engineering',t:`Tuned Mass Dampers: Keeping Skyscrapers Still`,d:`How a giant swinging weight near the top of a skyscraper quietly cancels out the sway caused by wind.`,r:`3 min`,tags:[`engineering`,`skyscrapers`,`physics`],body:[
 {t:'p',c:`Very tall buildings sway in the wind — not dangerously, but enough that occupants near the top can feel seasick on a windy day. Engineers solve this with an elegantly simple device: a massive pendulum hidden near the top of the building.`},
 {t:'h',c:`How it works`},
 {t:'p',c:`A tuned mass damper is typically a multi-hundred-ton block of steel or concrete suspended on cables or set on a sliding base, tuned so it naturally oscillates at nearly the same frequency as the building's sway. When wind pushes the building one way, the damper's inertia makes it lag behind and swing the opposite direction, canceling out much of the motion — the same principle as pushing against a swing to stop it.`},
 {t:'fact',c:[{k:`Taipei 101 damper`,v:`~660 tons`},{k:`Damper location`,v:`Near the top`},{k:`Sway reduction`,v:`Up to ~40%`}]},
 {t:'p',c:`Taipei 101's damper is famous for being visible to visitors — a giant gold sphere suspended between the 87th and 92nd floors, occasionally visibly swinging during typhoons.`},
],rel:['eng-bridges','avi-flight']},

{id:'avi-flight',cat:'aviation',t:`How Airplanes Actually Fly`,d:`Four forces are constantly fighting each other in the sky — understanding them explains almost everything about how planes work.`,r:`4 min`,tags:[`aviation`,`physics`,`flight`],body:[
 {t:'p',c:`Every aircraft in flight is a balance between four forces: lift, weight, thrust, and drag. Straight and level flight simply means lift equals weight and thrust equals drag — tip that balance and the plane climbs, descends, speeds up, or slows down.`},
 {t:'svg',c:'flightforces'},
 {t:'h',c:`Where lift actually comes from`},
 {t:'p',c:`The popular explanation — that curved wings make air travel faster over the top, lowering pressure — is incomplete. The fuller picture is that a wing tilted slightly upward (its angle of attack) deflects air downward as it passes, and by Newton's third law, the air pushes back up on the wing. Both the wing's shape and its angle contribute to this deflection.`},
 {t:'h',c:`Why planes stall`},
 {t:'p',c:`Push the angle of attack too high trying to generate more lift, and airflow over the wing separates and turns chaotic instead of flowing smoothly — lift collapses suddenly. This is a stall, and it's about angle, not speed; a plane can stall at any speed if the wing exceeds its critical angle.`},
],rel:['eng-skyscrapers','avi-blackbox','auto-engine']},

{id:'avi-blackbox',cat:'aviation',t:`The Black Box: Not Black, and Not a Box`,d:`Flight recorders are bright orange, built to survive nearly anything, and are one of the reasons flying keeps getting safer.`,r:`3 min`,tags:[`aviation`,`safety`,`investigation`],body:[
 {t:'p',c:`Every commercial aircraft carries two flight recorders, both painted bright international orange for visibility in wreckage — the "black box" nickname is a historical mystery, possibly from early charred prototypes or simply industry slang that stuck.`},
 {t:'h',c:`The two recorders`},
 {t:'ul',c:[`Flight Data Recorder (FDR) — logs hundreds of parameters like altitude, speed, and control positions, many times per second.`,`Cockpit Voice Recorder (CVR) — captures the last two hours of cockpit audio, including crew conversation and ambient sounds.`]},
 {t:'p',c:`Both are built to survive what destroyed the aircraft around them: they're rated to withstand impacts over 3,000 times the force of gravity, fire above 1,000°C for an hour, and deep ocean pressure for weeks. This durability is why investigators can often reconstruct exactly what happened even after catastrophic accidents.`},
 {t:'fact',c:[{k:`Impact survival`,v:`~3,400 g`},{k:`Fire survival`,v:`1,100°C / 1 hr`},{k:`CVR duration`,v:`Last 2 hours`}]},
 {t:'p',c:`Data from these recorders has directly driven safety improvements for decades — nearly every major change to pilot training or aircraft design traces back to lessons pulled from a black box.`},
],rel:['avi-flight','eng-bridges']},

{id:'auto-engine',cat:'auto',t:`How a Four-Stroke Engine Works`,d:`Intake, compression, power, exhaust — the four-beat rhythm that has powered most cars for over a century.`,r:`4 min`,tags:[`engines`,`automobiles`,`mechanics`],body:[
 {t:'p',c:`Almost every gasoline car engine, despite huge variety in size and cylinder count, runs on the same basic four-stroke cycle, first practically developed by Nikolaus Otto in 1876. Each cylinder repeats this four-beat cycle continuously while the engine runs.`},
 {t:'svg',c:'fourstroke'},
 {t:'ol',c:[`Intake — the piston moves down, drawing a fuel-air mixture into the cylinder as the intake valve opens.`,`Compression — the piston moves up, squeezing that mixture into a small space, both valves closed.`,`Power — a spark ignites the compressed mixture, and the resulting explosion forces the piston violently back down. This is the only stroke that actually produces power.`,`Exhaust — the piston moves up again, pushing burnt gases out through the now-open exhaust valve.`]},
 {t:'p',c:`This cycle repeats dozens of times per second at highway speed. The crankshaft converts the piston's up-and-down motion into rotation, and a flywheel smooths out the pulses so the engine feels continuous rather than like a series of small explosions — which, mechanically, it is.`},
],rel:['auto-ev','avi-flight','inv-print']},

{id:'auto-ev',cat:'auto',t:`How Electric Cars Actually Work`,d:`No pistons, no explosions, no gearbox in the traditional sense — EVs are mechanically far simpler than combustion cars.`,r:`4 min`,tags:[`electric vehicles`,`engines`,`automobiles`],body:[
 {t:'p',c:`An electric car replaces the hundreds of moving parts in a combustion engine with something closer to a large, powerful version of the motor inside a household fan. A battery pack sends electric current to a motor, which uses magnetism to spin a shaft connected directly to the wheels — no pistons, valves, or explosions involved.`},
 {t:'h',c:`Why EVs feel so different to drive`},
 {t:'ul',c:[`Instant torque — electric motors deliver near-maximum turning force from a standstill, unlike combustion engines that need to build rpm.`,`No traditional gearbox — most EVs use a single fixed-ratio gear, since motors work efficiently across a huge speed range.`,`Regenerative braking — lifting off the accelerator uses the motor as a generator, slowing the car while recovering energy back into the battery.`]},
 {t:'p',c:`The trade-off is energy density: gasoline packs roughly 50 times more energy per kilogram than a lithium-ion battery, which is why EV battery packs are large and heavy even though the drivetrain itself is mechanically simpler than a combustion engine.`},
 {t:'fact',c:[{k:`Gasoline energy density`,v:`~46 MJ/kg`},{k:`Li-ion battery density`,v:`~0.9 MJ/kg`},{k:`Typical EV motor parts`,v:`~20 moving`}]},
],rel:['auto-engine','fin-compound']},

{id:'ship-buoyancy',cat:'ships',t:`How Massive Ships Float`,d:`A single steel ship can weigh 200,000 tons and still float easily — the reason has nothing to do with the material it's made of.`,r:`3 min`,tags:[`ships`,`physics`,`buoyancy`],body:[
 {t:'p',c:`Steel is roughly eight times denser than water, so a solid steel block sinks instantly. A ship floats not because of what it's made of, but because of its shape — and a principle described by Archimedes over two thousand years ago.`},
 {t:'h',c:`Archimedes' principle`},
 {t:'p',c:`Any object in water displaces a volume of water equal to its own submerged volume, and the water pushes back with a force equal to the weight of that displaced water. A ship's hull is hollow, enclosing a huge volume of air. As long as the ship's total weight — steel, cargo, engines, and all — is less than the weight of the water its hull-shape would displace if fully submerged, it floats.`},
 {t:'h',c:`Why this matters for cargo`},
 {t:'p',c:`This is also why ships have a maximum safe loading line, marked on the hull as the Plimsoll line: load too much cargo and the ship sits lower, displacing more water, until it eventually has no freeboard left and takes on water over the sides.`},
],rel:['ship-container','eng-bridges']},

{id:'ship-container',cat:'ships',t:`Container Shipping and the Global Economy`,d:`A simple steel box, standardized in the 1950s, quietly became the single biggest reason global trade got cheap.`,r:`3 min`,tags:[`ships`,`trade`,`economics`],body:[
 {t:'p',c:`Before the 1950s, cargo was loaded onto ships piece by piece by dockworkers — a slow, expensive, labor-intensive process called break-bulk shipping. A single ship could sit in port for over a week just being loaded and unloaded.`},
 {t:'h',c:`Malcom McLean's idea`},
 {t:'p',c:`In 1956, American trucking entrepreneur Malcom McLean pioneered the standardized shipping container: a uniform steel box that could move seamlessly between trucks, trains, and ships without ever being unpacked. Standardized corner fittings let cranes lock, stack, and move containers in minutes instead of hours.`},
 {t:'fact',c:[{k:`Standard container`,v:`20 or 40 ft`},{k:`First container ship`,v:`1956, "Ideal X"`},{k:`Modern megaships`,v:`24,000+ TEU`}]},
 {t:'p',c:`The efficiency gain was staggering — loading costs dropped by well over 90%, which made shipping goods internationally cheap enough to reshape the entire global economy, enabling the modern model of manufacturing in one country and selling in another.`},
],rel:['ship-buoyancy','fin-inflation']},

{id:'space-star',cat:'space',t:`The Life Cycle of a Star`,d:`Every star, including the sun, is on a one-way journey from a cloud of gas to a fiery death — the details depend entirely on its mass.`,r:`4 min`,tags:[`space`,`astronomy`,`stars`],body:[
 {t:'p',c:`Stars are born, live for millions to trillions of years, and die — and the mass a star is born with almost entirely determines how that story unfolds. Gravity and nuclear fusion spend a star's whole life in a tug-of-war: gravity constantly tries to collapse the star, and fusion's outward pressure holds it up.`},
 {t:'h',c:`Birth`},
 {t:'p',c:`Stars form inside vast clouds of gas and dust called nebulae. Gravity slowly pulls a dense clump together until pressure and temperature at its core become high enough to ignite hydrogen fusion — the moment a star truly turns "on."`},
 {t:'h',c:`Death depends on mass`},
 {t:'ul',c:[`Low-mass stars like the sun eventually swell into a red giant, then shed their outer layers, leaving behind a slowly cooling white dwarf.`,`Massive stars burn through fuel far faster and end in a supernova — a catastrophic explosion that can briefly outshine an entire galaxy.`,`The densest remnants of a supernova collapse further into a neutron star, or if massive enough, a black hole.`]},
 {t:'quote',c:`Nearly every element heavier than iron in your body was forged in the death of a star.`},
],rel:['space-rocket','sci-water','phil-trolley']},

{id:'space-rocket',cat:'space',t:`How Rockets Escape Earth's Gravity`,d:`Escaping Earth isn't really about going up — it's about going fast enough sideways that you never come back down.`,r:`4 min`,tags:[`space`,`rockets`,`physics`],body:[
 {t:'p',c:`A common misconception is that rockets need to fly "high enough" to escape gravity. In reality, gravity is still very much present at orbital altitude — the International Space Station, at roughly 400 km up, still experiences about 90% of Earth's surface gravity. Orbit works differently: it's about speed, not height.`},
 {t:'h',c:`Falling, but missing`},
 {t:'p',c:`An object in orbit is technically in constant freefall toward Earth — but it's also moving sideways so fast that as it falls, the curve of the Earth drops away beneath it at the same rate. It never gets closer to the ground; it just keeps falling around the planet. This is why astronauts appear weightless: they aren't beyond gravity's reach, they're in continuous freefall.`},
 {t:'h',c:`Delta-v: the real cost of spaceflight`},
 {t:'p',c:`Rocket engineers think almost entirely in terms of delta-v — the total change in velocity a mission requires. Reaching low Earth orbit needs roughly 9.4 km/s of delta-v, which is why rockets are mostly fuel by mass; a typical rocket is over 85% propellant at launch.`},
 {t:'fact',c:[{k:`Orbital speed (LEO)`,v:`~7.8 km/s`},{k:`Delta-v to orbit`,v:`~9.4 km/s`},{k:`ISS altitude gravity`,v:`~90% of surface`}]},
],rel:['space-star','avi-flight','space-mars']},

{id:'hist-rome',cat:'history',t:`The Fall of the Roman Empire`,d:`Rome didn't fall in a single dramatic collapse — it eroded over centuries through causes historians still argue about.`,r:`4 min`,tags:[`history`,`rome`,`empire`],body:[
 {t:'p',c:`The Western Roman Empire's traditional end date is 476 CE, when the Germanic general Odoacer deposed the last Western emperor, Romulus Augustulus. But this single event was more a final formality than a sudden collapse — Rome had been weakening for roughly two centuries beforehand.`},
 {t:'h',c:`Contributing pressures`},
 {t:'ul',c:[`Economic strain — heavy taxation, inflation from debased currency, and a shrinking tax base weakened the state's ability to fund its own defense.`,`Military overreach — a border thousands of miles long became increasingly expensive and difficult to defend with Roman manpower alone.`,`Political instability — the third century alone saw dozens of emperors, many assassinated within months of taking power.`,`Migration and invasion pressure — Germanic and Hunnic peoples, some fleeing their own upheavals, pushed steadily into Roman territory.`,`The empire's split — dividing into Western and Eastern halves in 395 CE left the West with less wealth and fewer resources to draw on.`]},
 {t:'p',c:`Notably, the Eastern Roman Empire — later known as the Byzantine Empire — survived for nearly another thousand years, finally falling to the Ottomans in 1453. Rome didn't so much fall as its western half slowly ran out of the resources needed to hold itself together.`},
],rel:['hist-silkroad','mil-ww2','hist-alexandria']},

{id:'hist-silkroad',cat:'history',t:`The Silk Road: The World's First Global Network`,d:`Long before globalization was a word, a sprawling network of trade routes connected China to Rome — and quietly shaped the ancient world.`,r:`3 min`,tags:[`history`,`trade`,`asia`],body:[
 {t:'p',c:`The Silk Road wasn't a single road at all, but a shifting network of overland and maritime trade routes connecting East Asia to the Mediterranean, active from roughly the 2nd century BCE until the 15th century CE. The name itself is modern — coined by a German geographer in the 19th century.`},
 {t:'h',c:`More than silk`},
 {t:'p',c:`Chinese silk was the most famous export, but the routes carried spices, paper, gunpowder, glassware, and precious metals in both directions. Just as importantly, they carried ideas — Buddhism spread from India into China largely along these routes, and technologies like papermaking eventually reached Europe the same way.`},
 {t:'h',c:`An unintended consequence`},
 {t:'p',c:`The same routes that carried goods and ideas also carried disease. Many historians believe the Silk Road played a role in spreading the Black Death from Central Asia into Europe in the 14th century — one of the deadliest pandemics in human history, killing an estimated third of Europe's population.`},
 {t:'fact',c:[{k:`Active period`,v:`~2nd c. BCE – 15th c. CE`},{k:`Approx. length`,v:`~6,400 km`},{k:`Term coined`,v:`1877, by Ferdinand von Richthofen`}]},
],rel:['hist-rome','geo-tectonics']},

{id:'mil-ww2',cat:'military',t:`World War II: A Concise Overview`,d:`The deadliest conflict in human history, in broad strokes — how it started, its major turning points, and how it ended.`,r:`5 min`,tags:[`war`,`history`,`20th century`],body:[
 {t:'p',c:`World War II (1939–1945) was fought primarily between the Axis powers — Germany, Italy, and Japan — and the Allied powers, principally the United Kingdom, the Soviet Union, and the United States. It remains the deadliest conflict in history, with estimates of total deaths ranging from 70 to 85 million people.`},
 {t:'h',c:`How it began`},
 {t:'p',c:`Germany's invasion of Poland on September 1, 1939 triggered declarations of war from Britain and France. This followed years of German territorial expansion under Hitler that the rest of Europe had largely failed to check, alongside separate Japanese expansion in Asia that had already begun with the invasion of Manchuria in 1931.`},
 {t:'h',c:`Major turning points`},
 {t:'ul',c:[`Operation Barbarossa (1941) — Germany's invasion of the Soviet Union opened a massive Eastern Front that would ultimately consume the bulk of German manpower.`,`Pearl Harbor (1941) — Japan's attack brought the United States fully into the war.`,`Stalingrad (1942–43) — a catastrophic German defeat that marked the start of the Soviet push westward.`,`D-Day (1944) — Allied forces landed in Normandy, opening a decisive second front in Western Europe.`]},
 {t:'p',c:`The war in Europe ended with Germany's surrender in May 1945. The war in the Pacific ended in August 1945, following the atomic bombings of Hiroshima and Nagasaki — the only wartime use of nuclear weapons in history — and Japan's subsequent surrender.`},
],rel:['mil-coldwar','hist-rome']},

{id:'mil-coldwar',cat:'military',t:`The Cold War and Mutually Assured Destruction`,d:`Two superpowers, tens of thousands of nuclear weapons, and a strategy that kept the peace by guaranteeing total mutual annihilation.`,r:`4 min`,tags:[`war`,`nuclear`,`20th century`],body:[
 {t:'p',c:`The Cold War (roughly 1947–1991) was a decades-long standoff between the United States and the Soviet Union, fought through proxy wars, espionage, and an enormous arms race rather than direct combat between the two superpowers. Direct war between them never happened — largely because of one grim strategic concept.`},
 {t:'h',c:`Mutually Assured Destruction`},
 {t:'p',c:`By the 1960s, both superpowers held enough nuclear weapons to devastate each other many times over, even after absorbing a first strike. This meant any nuclear attack would guarantee the attacker's own annihilation in retaliation — an acronym fittingly shortened to MAD. Paradoxically, this made both sides extremely cautious, since neither could "win" a nuclear exchange in any meaningful sense.`},
 {t:'h',c:`The closest call`},
 {t:'p',c:`The 1962 Cuban Missile Crisis brought the world closer to nuclear war than at any other point in history, after the Soviet Union placed nuclear missiles in Cuba, within range of most of the continental United States. A tense thirteen-day standoff ended with a negotiated Soviet withdrawal, but declassified accounts later revealed several moments where miscommunication nearly triggered catastrophe.`},
 {t:'fact',c:[{k:`Cold War span`,v:`~1947–1991`},{k:`Peak warhead count`,v:`~70,000 combined`},{k:`Ended with`,v:`USSR dissolution, 1991`}]},
],rel:['mil-ww2','phil-trolley']},

{id:'geo-tectonics',cat:'geography',t:`Plate Tectonics: Why Continents Move`,d:`The continents aren't fixed — they're slowly drifting on plates of rock floating over a semi-molten layer beneath them.`,r:`4 min`,tags:[`geography`,`geology`,`earth science`],body:[
 {t:'p',c:`Earth's outer shell isn't a single solid piece — it's broken into roughly a dozen major tectonic plates that float atop the slowly flowing mantle beneath them, moving at roughly the speed your fingernails grow, a few centimeters per year.`},
 {t:'h',c:`What drives the motion`},
 {t:'p',c:`Heat from Earth's core drives slow convection currents in the mantle, dragging the plates above along with it. Where plates meet, three things can happen: they can collide, pull apart, or slide past one another — and each produces distinctly different geology.`},
 {t:'ul',c:[`Convergent boundaries — plates collide, often forcing one beneath the other (subduction) or crumpling both upward into mountain ranges, like the Himalayas.`,`Divergent boundaries — plates pull apart, allowing magma to rise and form new crust, as along the Mid-Atlantic Ridge.`,`Transform boundaries — plates slide past each other, building up stress that releases as earthquakes, as along California's San Andreas Fault.`]},
 {t:'p',c:`This slow-motion drift explains why the continents once fit together as a single landmass called Pangaea roughly 300 million years ago, and why fossils of the same species are found on continents now separated by entire oceans.`},
],rel:['geo-climate','space-star']},

{id:'geo-climate',cat:'geography',t:`Climate Zones of the World`,d:`A century-old classification system still used today to explain why some places are deserts, some are jungles, and some are tundra.`,r:`3 min`,tags:[`geography`,`climate`,`weather`],body:[
 {t:'p',c:`Developed by climatologist Wladimir Köppen in 1884 and refined over the following decades, the Köppen climate classification remains the most widely used system for categorizing the world's climates, based primarily on temperature and precipitation patterns.`},
 {t:'h',c:`The five main groups`},
 {t:'ul',c:[`Tropical (A) — warm year-round, no true winter; includes rainforests and savannas.`,`Dry (B) — evaporation exceeds precipitation; includes deserts and semi-arid steppes.`,`Temperate (C) — mild winters, distinct seasons; much of Europe and the eastern US.`,`Continental (D) — large temperature swings between summer and winter; interior North America and Asia.`,`Polar (E) — no true summer; permanent ice or tundra.`]},
 {t:'p',c:`These zones aren't arbitrary — they largely follow global patterns of atmospheric circulation and ocean currents, which is why deserts cluster around similar latitudes worldwide (roughly 30° north and south) regardless of continent.`},
],rel:['geo-tectonics','sci-water']},

{id:'prog-internet',cat:'programming',t:`How the Internet Actually Works`,d:`When you load a webpage, a remarkable relay of packets, addresses, and handshakes happens in well under a second.`,r:`5 min`,tags:[`programming`,`networking`,`internet`],body:[
 {t:'p',c:`Typing a web address into a browser triggers a surprisingly intricate sequence of steps, all completed in a fraction of a second. Breaking it down reveals how the entire modern internet actually functions underneath.`},
 {t:'h',c:`1. DNS — turning names into addresses`},
 {t:'p',c:`Computers route traffic using numeric IP addresses, not domain names. A DNS (Domain Name System) lookup translates a human-readable name like "example.com" into a numeric address, similar to looking up a phone number from a contact name.`},
 {t:'h',c:`2. The TCP handshake`},
 {t:'p',c:`Before sending data, your computer and the server perform a three-step handshake (SYN, SYN-ACK, ACK) to establish a reliable connection — essentially agreeing to talk before either side starts sending real information.`},
 {t:'h',c:`3. Packets`},
 {t:'p',c:`Data isn't sent as one continuous stream — it's broken into small chunks called packets, each labeled with its destination and position in the sequence. Packets can even travel different physical routes across the internet and get reassembled correctly on arrival.`},
 {t:'h',c:`4. HTTP(S)`},
 {t:'p',c:`Once connected, the browser sends an HTTP request for the page, and the server responds with the actual content — HTML, images, scripts — which the browser then assembles into the page you see. The "S" in HTTPS adds encryption on top, so the contents can't be read by anyone intercepting the traffic.`},
],rel:['cyber-osi','prog-bigo']},

{id:'prog-bigo',cat:'programming',t:`Big O Notation, Explained Simply`,d:`A way of describing how an algorithm slows down as its input grows — without getting lost in exact timing details.`,r:`4 min`,tags:[`programming`,`algorithms`,`computer science`],body:[
 {t:'p',c:`Big O notation describes how an algorithm's running time (or memory use) grows as its input size grows, ignoring hardware speed or constant factors. It answers a simple practical question: if I double the input, does my program get a little slower, or catastrophically slower?`},
 {t:'h',c:`Common complexities, from best to worst`},
 {t:'ul',c:[`O(1) — constant time. Looking up a value by its exact key, regardless of how much data exists.`,`O(log n) — logarithmic. Searching a sorted list by repeatedly halving it (binary search).`,`O(n) — linear. Checking every item in a list once.`,`O(n log n) — the typical cost of efficient sorting algorithms like mergesort.`,`O(n²) — quadratic. Comparing every item against every other item, common in naive nested loops.`]},
 {t:'p',c:`The difference matters enormously at scale. An O(n²) algorithm on a list of a million items requires roughly a trillion operations; an O(n log n) algorithm on the same list needs roughly twenty million — the difference between milliseconds and an impractical wait.`},
 {t:'quote',c:`Big O isn't about speed on your machine today — it's about whether your code still works when the input is a thousand times bigger.`},
],rel:['prog-internet','cyber-phishing']},

{id:'cyber-osi',cat:'cybersecurity',t:`The OSI Model and Where Attacks Happen`,d:`Networking's seven-layer mental model doubles as a map of where different cyberattacks actually target.`,r:`4 min`,tags:[`cybersecurity`,`networking`,`osi`],body:[
 {t:'p',c:`The OSI (Open Systems Interconnection) model is a conceptual framework, developed in the late 1970s, that breaks network communication into seven distinct layers. It's rarely implemented exactly as described, but it remains the standard mental model for understanding how data moves — and where it can be attacked.`},
 {t:'svg',c:'osilayers'},
 {t:'h',c:`Attacks by layer`},
 {t:'ul',c:[`Layer 7 (Application) — phishing, SQL injection, and malicious software targeting the actual programs users interact with.`,`Layer 4 (Transport) — SYN flood attacks that abuse the TCP handshake to overwhelm a server.`,`Layer 3 (Network) — IP spoofing, where attackers forge the source address of traffic.`,`Layer 2 (Data Link) — ARP spoofing, tricking devices on a local network into sending traffic to the wrong place.`]},
 {t:'p',c:`Most real-world cybersecurity incidents actually happen at Layer 7 — not because lower layers are unimportant, but because tricking a human or a poorly-written application is usually far easier than breaking well-engineered network protocols.`},
],rel:['prog-internet','cyber-phishing']},

{id:'cyber-phishing',cat:'cybersecurity',t:`Phishing and Social Engineering`,d:`The overwhelming majority of successful cyberattacks don't break through technology at all — they trick a person.`,r:`3 min`,tags:[`cybersecurity`,`phishing`,`social engineering`],body:[
 {t:'p',c:`Despite decades of technical security advances, the easiest way into almost any system remains the same: convince a human to hand over access voluntarily. This category of attack is called social engineering, and phishing is by far its most common form.`},
 {t:'h',c:`Common patterns to recognize`},
 {t:'ul',c:[`Urgency — "your account will be suspended in 24 hours" pressures people to act before thinking.`,`Authority — impersonating a boss, bank, or government agency to discourage questioning.`,`A mismatched link — the visible text says one thing, but the actual URL underneath points somewhere else entirely.`,`An unexpected request that's slightly plausible — a "vendor" asking to update payment details, sent at a busy moment.`]},
 {t:'h',c:`Spear phishing`},
 {t:'p',c:`Where basic phishing is sent broadly, spear phishing is personalized using real details about the target — their name, employer, or even a recent purchase — scraped from public sources like social media, making it dramatically more convincing and far harder to spot.`},
 {t:'quote',c:`Firewalls don't stop someone from being asked nicely, and convincingly, to open the front door.`},
],rel:['cyber-osi','psy-bias']},

{id:'fin-compound',cat:'finance',t:`Compound Interest: The Eighth Wonder`,d:`Widely (if apocryphally) attributed to Einstein — the simple mathematical reason why starting early matters more than almost anything else.`,r:`3 min`,tags:[`finance`,`investing`,`money`],body:[
 {t:'p',c:`Simple interest earns you a fixed return on your original amount, every period. Compound interest earns you a return on your original amount plus every bit of interest you've already accumulated — meaning your money starts earning money on its own earnings.`},
 {t:'svg',c:'compoundcurve'},
 {t:'h',c:`Why the shape matters`},
 {t:'p',c:`Early on, compound growth looks almost identical to simple growth — the difference is small. But because each period's gains get added to the base that earns future gains, the curve bends upward more and more steeply over time. This is why the effect is so much more powerful over decades than over a few years.`},
 {t:'h',c:`The Rule of 72`},
 {t:'p',c:`A quick mental shortcut: divide 72 by an annual interest rate to estimate how many years it takes an investment to double. At 6% annual growth, money doubles roughly every 12 years; at 9%, roughly every 8 years.`},
 {t:'fact',c:[{k:`$10,000 at 7%, 10 yrs`,v:`~$19,700`},{k:`$10,000 at 7%, 30 yrs`,v:`~$76,100`},{k:`Rule of 72 @ 8%`,v:`~9 years to double`}]},
],rel:['fin-inflation','auto-ev']},

{id:'fin-inflation',cat:'finance',t:`Inflation: Why Money Loses Value Over Time`,d:`The same dollar buys less every year — here's the mechanism behind it, and why a small amount of inflation is actually the goal.`,r:`3 min`,tags:[`finance`,`economics`,`inflation`],body:[
 {t:'p',c:`Inflation is the rate at which prices rise across an economy over time, which means the purchasing power of a fixed amount of money steadily falls. A basket of goods costing $100 today might cost $102 or $103 next year even if nothing about the goods themselves changed.`},
 {t:'h',c:`Why central banks don't aim for zero`},
 {t:'p',c:`It might seem like zero inflation would be ideal, but most central banks deliberately target a small positive rate — commonly around 2% annually. Mild, predictable inflation encourages spending and investment over hoarding cash, and gives central banks room to cut interest rates during downturns without hitting zero.`},
 {t:'h',c:`When it goes wrong`},
 {t:'p',c:`Runaway hyperinflation, by contrast, can be devastating — Germany's Weimar Republic in 1923 saw prices double roughly every few days at its peak, making cash essentially worthless within weeks of being earned. More commonly, moderate but persistent inflation quietly erodes savings that aren't invested to at least keep pace.`},
 {t:'fact',c:[{k:`Typical central bank target`,v:`~2% / year`},{k:`Weimar peak (1923)`,v:`Prices doubling every ~2 days`},{k:`$100 at 3% infl., 20 yrs`,v:`~$55 real value`}]},
],rel:['fin-compound','ship-container']},

{id:'psy-bias',cat:'psychology',t:`Cognitive Biases That Quietly Run Your Life`,d:`Your brain takes shortcuts to make fast decisions — and those shortcuts predictably distort how you see reality.`,r:`4 min`,tags:[`psychology`,`bias`,`decision making`],body:[
 {t:'p',c:`Cognitive biases are systematic, predictable patterns of deviation from rational judgment. They aren't a sign of low intelligence — they're built-in mental shortcuts that usually work well enough, but reliably fail in specific, well-documented situations.`},
 {t:'h',c:`A few worth knowing`},
 {t:'ul',c:[`Confirmation bias — the tendency to notice and remember information that confirms what you already believe, while overlooking what contradicts it.`,`Anchoring — over-relying on the first piece of information offered, even when it's irrelevant, when making a subsequent judgment.`,`Availability heuristic — judging how common or likely something is based on how easily examples come to mind, rather than actual statistics.`,`Sunk cost fallacy — continuing something because of what you've already invested, rather than what makes sense going forward.`]},
 {t:'p',c:`Simply knowing these biases exist doesn't make you immune to them — studies show even experts who study bias for a living still fall for it. What actually helps is building habits like seeking out disconfirming evidence and slowing down for high-stakes decisions.`},
],rel:['psy-maslow','cyber-phishing']},

{id:'psy-maslow',cat:'psychology',t:`Maslow's Hierarchy of Needs`,d:`A pyramid you've probably seen a hundred times — but the real theory behind it is more nuanced than the diagram suggests.`,r:`3 min`,tags:[`psychology`,`motivation`,`maslow`],body:[
 {t:'p',c:`Psychologist Abraham Maslow proposed in 1943 that human motivation follows a hierarchy of needs, often illustrated as a pyramid, where more basic needs generally need to be reasonably satisfied before higher ones become motivating priorities.`},
 {t:'h',c:`The five levels`},
 {t:'ol',c:[`Physiological — food, water, sleep, and other basic survival needs.`,`Safety — physical security, stable employment, health.`,`Love and belonging — friendship, intimacy, family connection.`,`Esteem — respect, recognition, a sense of accomplishment.`,`Self-actualization — realizing one's full personal potential.`]},
 {t:'p',c:`A common misconception is that the levels are strictly sequential — that you can't care about esteem until safety is fully guaranteed. Maslow's actual writing described it more flexibly: needs are generally prioritized in that order, but people can and do pursue multiple levels simultaneously, and the theory has been extensively debated and revised by later psychologists.`},
 {t:'quote',c:`What a man can be, he must be — Maslow's own phrase for the drive behind self-actualization.`},
],rel:['psy-bias','phil-stoicism']},

{id:'ppl-curie',cat:'people',t:`Marie Curie: Two Nobel Prizes, One Relentless Mind`,d:`The only person ever to win Nobel Prizes in two different sciences, working in a field that would ultimately cost her her life.`,r:`3 min`,tags:[`people`,`science history`,`nobel prize`],body:[
 {t:'p',c:`Marie Curie (1867–1934) remains the only person in history to win Nobel Prizes in two different scientific fields — Physics in 1903 for her work on radioactivity, and Chemistry in 1911 for discovering the elements polonium and radium.`},
 {t:'h',c:`Working against the odds`},
 {t:'p',c:`Born in Warsaw when Poland was under Russian control and women were barred from Polish universities, Curie moved to Paris to study at the Sorbonne, often surviving on little more than bread and tea while completing her degrees. She and her husband Pierre Curie conducted much of their early radioactivity research in a converted shed with no proper ventilation.`},
 {t:'h',c:`The cost of discovery`},
 {t:'p',c:`The dangers of radioactivity weren't yet understood, and Curie handled radioactive material with essentially no protection for decades, even carrying test tubes of radium in her pockets. She died in 1934 of aplastic anemia, almost certainly caused by her prolonged radiation exposure — her laboratory notebooks remain radioactive today and are stored in lead-lined boxes.`},
 {t:'fact',c:[{k:`Nobel Prizes`,v:`2 (Physics, Chemistry)`},{k:`Elements discovered`,v:`Polonium, radium`},{k:`Notebooks today`,v:`Still radioactive`}]},
],rel:['sci-vaccines','ppl-davinci']},

{id:'ppl-davinci',cat:'people',t:`Leonardo da Vinci: The Original Polymath`,d:`Famous for the Mona Lisa, but his notebooks reveal a mind that was centuries ahead in engineering, anatomy, and flight.`,r:`3 min`,tags:[`people`,`renaissance`,`art`],body:[
 {t:'p',c:`Leonardo da Vinci (1452–1519) is remembered today primarily as a painter, but his surviving notebooks — thousands of pages of sketches, diagrams, and notes — reveal a scientist and engineer who was studying anatomy, hydraulics, and flight centuries before those fields formally existed.`},
 {t:'h',c:`Beyond the canvas`},
 {t:'ul',c:[`He dissected dozens of human cadavers to accurately document musculature and anatomy, producing drawings that were more precise than published medical texts of the time.`,`He sketched detailed designs for flying machines, including an ornithopter with flapping wings and an early parachute concept, though none were built in his lifetime.`,`He studied water flow and designed canal and irrigation systems, some of which influenced real engineering projects.`]},
 {t:'p',c:`Notably, Leonardo completed relatively few paintings — fewer than twenty are confidently attributed to him — because he was constantly distracted by these other pursuits and frequently left projects unfinished, a trait his patrons often complained about.`},
 {t:'quote',c:`Simplicity is the ultimate sophistication — a phrase often attributed to Leonardo, capturing how he approached both art and engineering.`},
],rel:['ppl-curie','avi-flight']},

{id:'inv-print',cat:'inventions',t:`The Printing Press: The Machine That Changed Everything`,d:`Before Gutenberg, a single book could take a monk a year to copy by hand. His press changed the speed of human knowledge itself.`,r:`3 min`,tags:[`inventions`,`printing`,`history`],body:[
 {t:'p',c:`Before the mid-15th century, books in Europe were copied entirely by hand, usually by monks, making them extraordinarily expensive and rare — a single Bible could take a scribe over a year to complete. Johannes Gutenberg's movable-type printing press, developed around 1440 in Germany, changed that almost overnight.`},
 {t:'h',c:`The key innovation`},
 {t:'p',c:`Gutenberg's breakthrough wasn't printing itself — woodblock printing already existed in Asia — but reusable, individually cast metal letters that could be arranged, printed, and rearranged for a new page, combined with an oil-based ink and a repurposed wine-press mechanism for consistent pressure.`},
 {t:'h',c:`The ripple effects`},
 {t:'p',c:`Within 50 years of Gutenberg's press, an estimated 20 million books had been printed across Europe — up from a mere few thousand in the prior centuries. This explosion of accessible text is widely credited with accelerating the Renaissance, enabling the Protestant Reformation, and dramatically increasing literacy rates across the continent.`},
 {t:'fact',c:[{k:`Press developed`,v:`~1440, Mainz`},{k:`Books by 1500`,v:`~20 million`},{k:`Bible copy time before`,v:`~1 year, by hand`}]},
],rel:['inv-penicillin','book-1984']},

{id:'inv-penicillin',cat:'inventions',t:`Penicillin: An Accidental Discovery That Saved Millions`,d:`A messy lab, an unwashed petri dish, and a mold that changed medicine forever — one of history's most famous scientific accidents.`,r:`3 min`,tags:[`inventions`,`medicine`,`history`],body:[
 {t:'p',c:`In 1928, Scottish bacteriologist Alexander Fleming returned from a summer holiday to find a petri dish he'd forgotten to clean before leaving. Instead of throwing it out, he noticed something odd: a patch of mold had contaminated the dish, and bacteria near it had died.`},
 {t:'h',c:`From curiosity to medicine`},
 {t:'p',c:`Fleming identified the mold as Penicillium and correctly guessed it was releasing a substance that killed bacteria, which he named penicillin. However, he struggled to isolate and produce it in usable quantities, and his discovery sat relatively unexploited for over a decade.`},
 {t:'p',c:`It took a separate team — Howard Florey and Ernst Chain at Oxford — to figure out how to purify and mass-produce penicillin in the early 1940s, just in time for it to be used extensively on wounded soldiers during World War II, dramatically reducing deaths from infected wounds that had previously been almost routinely fatal.`},
 {t:'quote',c:`I did not invent penicillin. Nature did that. I only discovered it by accident — Fleming's own, characteristically modest, description.`},
 {t:'fact',c:[{k:`Discovered`,v:`1928, London`},{k:`Mass production`,v:`Early 1940s`},{k:`Nobel Prize`,v:`1945 (shared)`}]},
],rel:['inv-print','sci-vaccines','sci-antibiotics']},

{id:'book-1984',cat:'books',t:`1984 by George Orwell`,d:`A 1949 dystopian novel so influential its terminology — Big Brother, doublethink, thoughtcrime — entered everyday language.`,r:`3 min`,tags:[`books`,`fiction`,`dystopia`],body:[
 {t:'p',c:`Published in 1949, George Orwell's Nineteen Eighty-Four imagines a totalitarian future state, Oceania, that maintains absolute control not just over citizens' actions but over their thoughts, memories, and even the historical record itself.`},
 {t:'h',c:`Core ideas`},
 {t:'ul',c:[`Big Brother — the all-seeing, possibly fictional figurehead of the ruling Party, watching citizens through omnipresent telescreens.`,`Doublethink — the ability to simultaneously hold two contradictory beliefs and accept both as true.`,`Newspeak — a deliberately shrinking official language designed to make certain rebellious thoughts literally impossible to express.`,`The Ministry of Truth — the government body responsible for rewriting history and news to always match the Party's current position.`]},
 {t:'p',c:`Orwell wrote the novel partly as a response to the totalitarian regimes of his era — particularly Stalinist Russia — and as a warning about the mechanisms authoritarian power can use regardless of ideology. Its vocabulary has become so embedded in political discourse that "Orwellian" is now a standalone adjective.`},
],rel:['book-sapiens','phil-trolley']},

{id:'book-sapiens',cat:'books',t:`Sapiens by Yuval Noah Harari`,d:`A sweeping 2011 history of humankind built around one central idea: our species' real superpower is believing in shared fictions.`,r:`3 min`,tags:[`books`,`nonfiction`,`history`],body:[
 {t:'p',c:`Historian Yuval Noah Harari's Sapiens (2011) traces the entire history of Homo sapiens, from insignificant African primates to the dominant species on the planet, organized around one central thesis: what truly separates humans from other animals is our unique ability to believe in shared fictions.`},
 {t:'h',c:`Shared fictions`},
 {t:'p',c:`Harari argues that things like money, nations, corporations, and religions have no physical reality — they exist only because large numbers of people collectively agree to believe in them. This shared belief is what allows humans, unlike any other species, to cooperate flexibly in groups far larger than a few dozen individuals.`},
 {t:'h',c:`Three revolutions`},
 {t:'p',c:`The book frames human history around three major turning points: the Cognitive Revolution (roughly 70,000 years ago, when complex language and abstract thought emerged), the Agricultural Revolution (roughly 12,000 years ago), and the Scientific Revolution (roughly 500 years ago) — arguing provocatively that agriculture may have made everyday life worse for most individuals even as it enabled civilization to scale.`},
],rel:['book-1984','phil-stoicism']},

{id:'film-citizenkane',cat:'film',t:`Citizen Kane and the Birth of Modern Cinema`,d:`Orson Welles was 25 when he made a film so technically radical it's still taught in film schools eight decades later.`,r:`3 min`,tags:[`film`,`cinema history`,`classics`],body:[
 {t:'p',c:`Released in 1941, Citizen Kane was directed, co-written, and starred in by Orson Welles at just 25 years old — his very first feature film. It's routinely ranked among the greatest films ever made, largely because of how many filmmaking techniques it pioneered or popularized simultaneously.`},
 {t:'h',c:`What made it radical`},
 {t:'ul',c:[`Deep focus cinematography — keeping foreground and background objects both sharply in focus, letting multiple story elements play out within a single shot.`,`Non-linear storytelling — the film is told through fragmented flashbacks pieced together by a reporter, rather than in chronological order.`,`Innovative lighting and low camera angles — shooting up toward ceilings, unusual for the era, to make sets feel oppressive and grand.`]},
 {t:'p',c:`The film's plot loosely mirrored the life of real newspaper magnate William Randolph Hearst, who was reportedly furious about the resemblance and used his considerable media influence to suppress the film's promotion — a controversy that likely hurt its initial box office despite its now-legendary critical status.`},
],rel:['film-pixar','book-1984']},

{id:'film-pixar',cat:'film',t:`How Pixar Changed Animation Forever`,d:`Before Toy Story, feature-length computer animation was considered commercially impossible. One studio proved otherwise in 1995.`,r:`3 min`,tags:[`film`,`animation`,`technology`],body:[
 {t:'p',c:`Pixar began not as a film studio but as a computer hardware division of Lucasfilm, later spun off and purchased by Steve Jobs in 1986. For years it survived mainly by selling specialized graphics computers and short technical demo animations, not by making movies.`},
 {t:'h',c:`Toy Story, 1995`},
 {t:'p',c:`Toy Story became the first entirely computer-animated feature film in history, a technical gamble that took roughly four years and pushed 1990s computing hardware to its absolute limits — some complex scenes reportedly took over 24 hours per single frame to render.`},
 {t:'h',c:`Why it mattered beyond the technology`},
 {t:'p',c:`Pixar's deeper innovation, arguably more important than the computer graphics itself, was insisting that technically groundbreaking animation still needed genuinely strong, emotionally grounded storytelling — a philosophy captured in their internal mantra that "story is king," which shaped the studio's unusually consistent critical success for decades afterward.`},
 {t:'fact',c:[{k:`Toy Story release`,v:`1995`},{k:`Production time`,v:`~4 years`},{k:`Rendering, complex frames`,v:`Up to 24+ hrs each`}]},
],rel:['film-citizenkane','prog-bigo']},
